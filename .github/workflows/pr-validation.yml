name: PR Validation

# Only PRs to `main` are validated here. The auto-promotion PR targets
# `stable` (head `auto/promote-main-to-stable`) and is authored by
# github-actions[bot], so GitHub parks every pull_request-triggered run on it
# and resolves them to 0-job `failure` once the PR auto-merges (verified
# 2026-08-31: three 0-job `failure` runs on promotion PR #127). Restricting to
# `main` drops that noise; `stable` only ever receives the auto-promotion PR,
# which posts its own synthetic `validate` status (verified 2026-08-31).
on:
  pull_request:
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate
        uses: projectbluefin/actions/bootc-build/validate-pr@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
        with:
          shellcheck-glob: "build/*.sh"
          dockerfile: "Containerfile"
          hadolint-config: ".hadolint.yaml"
