name: PR Validation

# Only PRs to `main` are validated. The auto-promotion PR targets `stable`
# (head `auto/promote-main-to-stable`); it is authored by github-actions[bot],
# so GitHub parks every pull_request-triggered run on it pending approval and
# they resolve to 0-job `failure` noise once the PR auto-merges. The promotion
# is a squash of already-validated main commits and carries its own synthetic
# `validate` status, so it needs no re-validation here. No human/Renovate PR
# ever targets `stable` (verified 2026-08-31: all 39 `stable` PRs were the
# auto-promotion branch).
on:
  pull_request:
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate
        uses: projectbluefin/actions/bootc-build/validate-pr@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
        with:
          shellcheck-glob: "build/*.sh"
          dockerfile: "Containerfile"
          hadolint-config: ".hadolint.yaml"
