name: enforce workflow labels

on:
  issues:
    types: [opened, edited, labeled, unlabeled]
  pull_request:
    # Only PRs to `main`. The auto-promotion PR targets `stable` (head
    # `auto/promote-main-to-stable`) and is authored by github-actions[bot],
    # so GitHub parks its pull_request-triggered runs pending approval and
    # they show as 0-job `failure` noise once the PR auto-merges. See the
    # comment in pr-validation.yml for the same rationale.
    branches:
      - main
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  enforce:
    uses: projectbluefin/actions/.github/workflows/reusable-design-enforcement.yml@ce7ab75eb66d3ace300fed4c121a31b417e8f9fe
    secrets: inherit
    with:
      required-field-groups: '[["What happened?","What would you like to see?","What specifically should the agent focus on?"]]'
