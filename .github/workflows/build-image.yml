---
name: Build and Push Image

# Single-branch model: `main` IS production.
#   Every change lands via a PR; the `build` check builds the image on the PR
#   and writes the layer + DNF cache to GHCR (REGISTRY_CACHE_WRITE=1). The
#   post-merge push build on `main` reuses that cache — no recompilation, just
#   download/assemble/sign/push — then publishes :stable plus generated tags.
#   There is no `stable` branch, promotion PR, or PROMOTE_TOKEN.
# Fork PRs are rejected by the guard step below: main is production and there
#   is no testing stream to absorb unverified forks, so they would only poison
#   the shared cache.
# No paths-ignore: `main` branch protection requires the `build` check, and a
#   skipped workflow never reports it, leaving PRs merge-blocked even when all
#   reported checks pass. Every PR builds (cheap via cache).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_VENDOR: "${{ github.repository_owner }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  IMAGE_DESC: "My Customized Universal Blue Image"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"
  DEFAULT_TAG: "stable"
  TAG_STREAM: "stable" # Stream passed to generate-tags; single-branch model keeps it on "stable"
  # PR builds also write the layer + DNF cache so the post-merge `main` build
  # is a fast cache-reuse assembly. No forks reach here (guard step below), so
  # there is no cache-poisoning risk.
  REGISTRY_CACHE_WRITE: "1"
  ENABLE_RECHUNKING: "false"
  RECHUNK_MAX_LAYERS: "128"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      # main is production. Only PRs from branches inside this repo are
      # accepted; fork PRs would write to the shared layer/DNF cache with an
      # untrusted tree. Fail fast, before any build work.
      - name: Block fork PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Fork PRs are not accepted. main is the production branch; open your PR from a branch in ${GITHUB_REPOSITORY}."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preflight
        id: preflight
        uses: projectbluefin/actions/bootc-build/preflight@8906e13e3ac1654504e75ad27440bffb28e52fbc # v1
        with:
          registry: ghcr.io
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@8906e13e3ac1654504e75ad27440bffb28e52fbc # v1
        with:
          storage-backend: btrfs
          update-podman: "true"
          install-tools: '["just"]'

      - name: Restore DNF cache
        id: dnf-cache-restore
        uses: projectbluefin/actions/bootc-build/dnf-cache@8906e13e3ac1654504e75ad27440bffb28e52fbc # v1
        with:
          action: restore
          cache-name: ${{ env.IMAGE_NAME }}
          cache-bust: ${{ hashFiles('**/Containerfile') }}

      - name: Detect changes
        id: detect-changes
        uses: projectbluefin/actions/bootc-build/detect-changes@8906e13e3ac1654504e75ad27440bffb28e52fbc # v1
        with:
          filters: |
            image:
              - 'Containerfile'
              - 'build/**'
              - 'custom/**'
              - 'Justfile'

      - name: Build image
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: build-image
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_VENDOR: ${{ env.IMAGE_VENDOR }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
          REGISTRY_CACHE_WRITE: ${{ env.REGISTRY_CACHE_WRITE }}
        with:
          timeout_minutes: 120
          max_attempts: 3
          retry_wait_seconds: 300
          command: |
            sudo -E "$(command -v just)" build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Get version label
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: version
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          VERSION_LABEL=$(sudo podman inspect "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          echo "version=${VERSION_LABEL}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${VERSION_LABEL}"

      - name: Generate tags
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: generate-tags
        uses: projectbluefin/actions/bootc-build/generate-tags@8906e13e3ac1654504e75ad27440bffb28e52fbc # v1
        with:
          base-name: ${{ env.IMAGE_NAME }}
          stream-name: ${{ env.TAG_STREAM }}
          version-label: ${{ steps.version.outputs.version }}
          event-name: ${{ github.event_name }}
          pr-number: ${{ github.event.number }}

      # generate-tags emits stream-native tags (stable-daily* plus version
      # aliases). Dedupe them and guarantee the mutable consumer tag (:stable)
      # is always published.
      - name: Finalize branch tags
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: branch-tags
        shell: bash
        env:
          GENERATED_TAGS: ${{ steps.generate-tags.outputs.tags }}
        run: |
          read -r -a generated_tags <<< "${GENERATED_TAGS}"
          branch_tags=()

          add_tag() {
            local candidate="$1"
            local existing
            for existing in "${branch_tags[@]}"; do
              [[ "${existing}" == "${candidate}" ]] && return
            done
            branch_tags+=("${candidate}")
          }

          for tag in "${generated_tags[@]}"; do
            add_tag "${tag}"
          done
          add_tag "${DEFAULT_TAG}"

          echo "tags=${branch_tags[*]}" >> "${GITHUB_OUTPUT}"
          echo "default-tag=${DEFAULT_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Save DNF cache
        if: always() && !cancelled()
        uses: projectbluefin/actions/bootc-build/dnf-cache@8906e13e3ac1654504e75ad27440bffb28e52fbc # v1
        with:
          action: save
          cache-name: ${{ env.IMAGE_NAME }}
          allow-write: true
          cache-bust: ${{ hashFiles('**/Containerfile') }}

      # OPTIONAL: Set ENABLE_RECHUNKING to "true" above to optimize OTA deltas.
      # This uses OCI-native chunkah and does not require bootc-base-imagectl.
      - name: Rechunk image
        if: env.ENABLE_RECHUNKING == 'true' && github.event_name != 'pull_request'
        id: rechunk-image
        uses: projectbluefin/actions/bootc-build/chunka@8906e13e3ac1654504e75ad27440bffb28e52fbc # v1
        with:
          source-image: localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          max-layers: ${{ env.RECHUNK_MAX_LAYERS }}

      - name: Tag images
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ALIAS_TAGS: ${{ steps.branch-tags.outputs.tags }}
        run: |
          sudo -E "$(command -v just)" tag-images "${IMAGE_NAME}" \
                          "${DEFAULT_TAG}" \
                          "${ALIAS_TAGS}"

      # Publish only from `main` pushes; PR builds only build and validate,
      # they never publish.
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        id: push
        uses: projectbluefin/actions/bootc-build/push-image@8906e13e3ac1654504e75ad27440bffb28e52fbc # v1
        with:
          image-name: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.branch-tags.outputs.tags }}
          default-tag: ${{ steps.branch-tags.outputs.default-tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # OPTIONAL: Sign and attest (SLSA Build L2 provenance)
      # Bluefin pattern: keyless OIDC signing via Fulcio.
      # Enabled for production. Requires 'id-token: write' permission (already granted).
      # Non-fatal — signing failures never block image publishing.

      - name: Sign and publish
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: projectbluefin/actions/bootc-build/sign-and-publish@8906e13e3ac1654504e75ad27440bffb28e52fbc # v1
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          digest: ${{ steps.push.outputs.digest }}
          signing-mode: keyless
          generate-sbom: false
          push-attestation: true
          certificate-identity-regexp: https://github.com/${{ github.repository }}/.github/workflows/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build telemetry summary
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        shell: bash
        run: |
          IMAGE_SIZE=$(sudo podman image inspect "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" \
            --format '{{.Size}}' 2>/dev/null || echo "0")
          IMAGE_SIZE_MB=$(( IMAGE_SIZE / 1024 / 1024 ))
          LAYER_COUNT=$(sudo podman image inspect "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" \
            --format '{{len .RootFS.Layers}}' 2>/dev/null || echo "?")

          {
            echo "## Build Telemetry: ${{ env.IMAGE_NAME }}"
            echo ""
            echo "**Image size (uncompressed):** ${IMAGE_SIZE_MB} MB"
            echo "**Layer count:** ${LAYER_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"
