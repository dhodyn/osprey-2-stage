---
name: Build and Push Image

# Two-branch model:
#   main   = testing branch, publishes :stable-testing (plus :testing for the
#            factory release gate)
#   stable = production branch, publishes :stable
# promote-main-to-stable.yml opens the main -> stable promotion PR.
#
# PR builds are disabled by default to save CI minutes. To enable them, add:
#   pull_request:
#     branches:
#       - main
#     paths-ignore:
#       - "**.md"
#       - ".github/workflows/*validate*.yml"
on:
  push:
    branches:
      - main
      - stable
    paths-ignore:
      - "**.md"
      - ".github/workflows/*validate*.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_VENDOR: "${{ github.repository_owner }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  IMAGE_DESC: "My Customized Universal Blue Image"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"
  DEFAULT_TAG: "stable"
  PRODUCTION_BRANCH: "stable" # The branch that publishes :stable production images
  REGISTRY_CACHE_WRITE: ${{ github.event_name != 'pull_request' && '1' || '0' }}
  ENABLE_RECHUNKING: "false"
  RECHUNK_MAX_LAYERS: "128"

# One build at a time across all refs: the stable promotion build starts
# AFTER main finishes, so it inherits main's freshly written GHCR layer
# cache (Justfile --cache-from/--cache-to) instead of racing it cold.
# cancel-in-progress is off — a queued run must never kill an in-progress
# production publish mid-push.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      # Anything not on the production branch is a testing build. TAG_STREAM
      # keeps generate-tags on the "testing" stream so it never emits
      # stable-daily* aliases that would collide with production; the
      # Finalize branch tags step renames them to stable-testing-*.
      - name: Determine image tag
        id: determine-tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${REF_NAME}" != "${PRODUCTION_BRANCH}" ]]; then
            echo "DEFAULT_TAG=${DEFAULT_TAG}-testing" >> "${GITHUB_ENV}"
            echo "TAG_STREAM=testing" >> "${GITHUB_ENV}"
            echo "Building testing image: ${DEFAULT_TAG}-testing"
          else
            echo "TAG_STREAM=${DEFAULT_TAG}" >> "${GITHUB_ENV}"
            echo "Building production image: ${DEFAULT_TAG}"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preflight
        id: preflight
        uses: projectbluefin/actions/bootc-build/preflight@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
        with:
          registry: ghcr.io
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
        with:
          storage-backend: btrfs
          update-podman: "true"
          install-tools: '["just"]'

      - name: Restore DNF cache
        id: dnf-cache-restore
        uses: projectbluefin/actions/bootc-build/dnf-cache@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
        with:
          action: restore
          cache-name: ${{ env.IMAGE_NAME }}
          cache-bust: ${{ hashFiles('**/Containerfile') }}

      - name: Detect changes
        id: detect-changes
        uses: projectbluefin/actions/bootc-build/detect-changes@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
        with:
          filters: |
            image:
              - 'Containerfile'
              - 'build/**'
              - 'custom/**'
              - 'Justfile'

      - name: Build image
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: build-image
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_VENDOR: ${{ env.IMAGE_VENDOR }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
          REGISTRY_CACHE_WRITE: ${{ env.REGISTRY_CACHE_WRITE }}
        with:
          # Cold-cache builds have exceeded 120 min; 240 leaves headroom
          # inside the 360-min job ceiling.
          timeout_minutes: 240
          max_attempts: 3
          retry_wait_seconds: 300
          command: |
            # Authenticate GHCR before building. The Justfile consults the
            # GHCR layer cache (podman build --cache-from/--cache-to);
            # anonymous blob lookups stall ~25 min per RUN step (throttled),
            # which silently starves every cache hit and times builds out.
            # Authenticated requests use the token quota instead of the
            # shared anonymous-IP pool and pull in seconds.
            #
            # All podman commands run rootless (no sudo) to use fuse-overlayfs
            # instead of VFS. Rootful podman on CI falls back to VFS when
            # native-overlay is disabled and btrfs loopback is absent — VFS
            # copies the entire rootfs (~12 GB) per RUN step = 18-24 min
            # commits. Rootless podman with fuse-overlayfs = instant commits.
            export REGISTRY_AUTH_FILE="${RUNNER_TEMP}/ghcr-auth.json"
            echo "${GITHUB_TOKEN}" | podman login --authfile "${REGISTRY_AUTH_FILE}" ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            # Seed the local blob cache from the last published image. Every
            # blob of every per-step cache image is contained in the final
            # pushed image, so pre-pulling it makes --cache-from lookups
            # metadata-only: podman's blob-info cache skips digests it
            # already has, and no RUN step can hang re-fetching base-chain
            # blobs through a throttled connection. Best-effort: a missing
            # tag just means a cold first build.
            echo "::group::Seed blob cache"
            for seed_tag in "${DEFAULT_TAG}" "${DEFAULT_TAG}-testing" "testing"; do
              echo "Trying seed tag: ${seed_tag}"
              if podman pull "ghcr.io/${IMAGE_VENDOR}/${IMAGE_NAME}:${seed_tag}" 2>&1; then
                echo "Seeded successfully from ${seed_tag}"
                break
              else
                echo "Seed tag ${seed_tag} not available"
              fi
            done
            echo "Local images after seed:"
            podman images --format "{{.Repository}}:{{.Tag}} {{.Size}}" | grep -E "^ghcr|IMAGE" || true
            echo "Storage driver:"
            podman info --format '{{.Driver}}' || true
            echo "::endgroup::"

            "$(command -v just)" build "${IMAGE_NAME}" "${DEFAULT_TAG}"
            podman logout --authfile "${REGISTRY_AUTH_FILE}" ghcr.io || true

      - name: Get version label
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: version
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          VERSION_LABEL=$(podman inspect "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          echo "version=${VERSION_LABEL}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${VERSION_LABEL}"

      - name: Generate tags
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: generate-tags
        uses: projectbluefin/actions/bootc-build/generate-tags@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
        with:
          base-name: ${{ env.IMAGE_NAME }}
          stream-name: ${{ env.TAG_STREAM }}
          version-label: ${{ steps.version.outputs.version }}
          event-name: ${{ github.event_name }}
          pr-number: ${{ github.event.number }}

      # generate-tags emits stream-native tags (testing* or stable-daily* plus
      # version aliases). For testing builds this renames testing* tags to
      # stable-testing-*, keeps the bare :testing tag (the factory release
      # gate in reusable-promote-squash.yml resolves digests from it), and
      # guarantees the mutable consumer tag (:stable / :stable-testing) is
      # always published.
      - name: Finalize branch tags
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: branch-tags
        shell: bash
        env:
          GENERATED_TAGS: ${{ steps.generate-tags.outputs.tags }}
        run: |
          read -r -a generated_tags <<< "${GENERATED_TAGS}"
          branch_tags=()

          add_tag() {
            local candidate="$1"
            local existing
            for existing in "${branch_tags[@]}"; do
              [[ "${existing}" == "${candidate}" ]] && return
            done
            branch_tags+=("${candidate}")
          }

          for tag in "${generated_tags[@]}"; do
            if [[ "${TAG_STREAM}" == "testing" ]]; then
              # Bare :testing stays so the promotion release gate can resolve it.
              [[ "${tag}" == "testing" ]] && add_tag "${tag}"
              add_tag "${tag/testing/stable-testing}"
            else
              add_tag "${tag}"
            fi
          done
          add_tag "${DEFAULT_TAG}"

          echo "tags=${branch_tags[*]}" >> "${GITHUB_OUTPUT}"
          echo "default-tag=${DEFAULT_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Save DNF cache
        if: always() && !cancelled() && github.event_name != 'pull_request'
        uses: projectbluefin/actions/bootc-build/dnf-cache@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
        with:
          action: save
          cache-name: ${{ env.IMAGE_NAME }}
          allow-write: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          cache-bust: ${{ hashFiles('**/Containerfile') }}

      # OPTIONAL: Set ENABLE_RECHUNKING to "true" above to optimize OTA deltas.
      # This uses OCI-native chunkah and does not require bootc-base-imagectl.
      - name: Rechunk image
        if: env.ENABLE_RECHUNKING == 'true' && github.event_name != 'pull_request'
        id: rechunk-image
        uses: projectbluefin/actions/bootc-build/chunka@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
        with:
          source-image: localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          max-layers: ${{ env.RECHUNK_MAX_LAYERS }}

      - name: Tag images
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ALIAS_TAGS: ${{ steps.branch-tags.outputs.tags }}
        run: |
          # Get the image ID from rootless storage, then re-tag with all aliases.
          IMAGE_ID=$(podman inspect "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" --format '{{.Id}}')
          podman untag "localhost/${IMAGE_NAME}:${DEFAULT_TAG}"
          for tag in ${ALIAS_TAGS}; do
            podman tag "${IMAGE_ID}" "${IMAGE_NAME}:${tag}"
          done
          podman tag "${IMAGE_ID}" "${IMAGE_NAME}:${DEFAULT_TAG}"
          echo "Tagged ${IMAGE_NAME} with: ${ALIAS_TAGS}"

      # Publish from both the testing (main) and production (stable) branches;
      # PR builds only build and validate, they never publish.
      # All podman commands run rootless — no rootful storage involved.
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        id: push
        shell: bash
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_VENDOR: ${{ env.IMAGE_VENDOR }}
          TAGS: ${{ steps.branch-tags.outputs.tags }}
          DEFAULT_TAG: ${{ steps.branch-tags.outputs.default-tag }}
          DIGEST_FILE: ${{ runner.temp }}/push-digest
        run: |
          set -euo pipefail

          REGISTRY_PATH="${REGISTRY}/${IMAGE_VENDOR}"

          # Determine default tag (first tag if not specified)
          read -r -a TAG_ARRAY <<< "${TAGS}"
          DEFAULT_TAG="${DEFAULT_TAG:-${TAG_ARRAY[0]}}"

          # Push with retry — rootless podman push with zstd:chunked compression
          attempt=0
          MAX_ATTEMPTS=3
          RETRY_WAIT=15
          while true; do
            attempt=$((attempt + 1))
            rm -f "${DIGEST_FILE}"

            podman push \
              --compression-format zstd:chunked \
              --retry 5 --retry-delay 30s \
              "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
              "${REGISTRY_PATH}/${IMAGE_NAME}:${DEFAULT_TAG}"

            # Capture digest
            skopeo inspect --no-tags \
              "docker://${REGISTRY_PATH}/${IMAGE_NAME}:${DEFAULT_TAG}" \
              | jq -r '.Digest' > "${DIGEST_FILE}"

            if [[ -s "${DIGEST_FILE}" ]] && [[ $(<"${DIGEST_FILE}") != "null" ]]; then
              break
            fi

            if [[ ${attempt} -ge ${MAX_ATTEMPTS} ]]; then
              echo "::error::Push failed after ${MAX_ATTEMPTS} attempts"
              exit 1
            fi
            echo "Push attempt ${attempt} failed, retrying in ${RETRY_WAIT}s..."
            sleep "${RETRY_WAIT}"
          done

          DIGEST=$(<"${DIGEST_FILE}")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "registry-path=${REGISTRY_PATH}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE_NAME}:${DEFAULT_TAG} -> ${DIGEST}"

          # Server-side copy for all alias tags (no re-upload)
          for tag in "${TAG_ARRAY[@]}"; do
            if [[ "${tag}" != "${DEFAULT_TAG}" ]]; then
              skopeo copy \
                "docker://${REGISTRY_PATH}/${IMAGE_NAME}:${DEFAULT_TAG}" \
                "docker://${REGISTRY_PATH}/${IMAGE_NAME}:${tag}"
              echo "Copied alias: ${tag}"
            fi
          done

      # OPTIONAL: Sign and attest (SLSA Build L2 provenance)
      # Bluefin pattern: keyless OIDC signing via Fulcio.
      # Non-fatal — signing failures never block image publishing.
      - name: Sign and publish
        if: github.event_name != 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail

          # Install cosign if not present
          if ! command -v cosign &>/dev/null; then
            curl -sSL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o /usr/local/bin/cosign
            chmod +x /usr/local/bin/cosign
          fi

          # Keyless OIDC signing via Fulcio (requires id-token: write)
          echo "::group::Sign container image"
          for attempt in 1 2 3; do
            if cosign sign -y \
              --new-bundle-format=false \
              --use-signing-config=false \
              "${IMAGE}@${DIGEST}"; then
              echo "Signed successfully"
              break
            fi
            echo "Sign attempt ${attempt} failed, retrying in 30s..."
            sleep 30
          done
          echo "::endgroup::"

          # Verify signature
          echo "::group::Verify signature"
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
          echo "::endgroup::"

          # Assert legacy .sig tag exists (podman/bootc compatibility)
          echo "::group::Assert legacy .sig tag"
          sig_tag="${DIGEST/:/-}.sig"
          if ! cosign download signature "${IMAGE}@${DIGEST}" >/dev/null 2>&1; then
            echo "::error::No legacy signature tag ${IMAGE}:${sig_tag}"
            echo "::error::containers/image only discovers signatures via .sig tag"
            exit 1
          fi
          echo "Legacy .sig tag present: ${sig_tag}"
          echo "::endgroup::"

          # GitHub Build Provenance Attestation
          # (uses built-in actions/attest — needs ACTIONS_ID_TOKEN_REQUEST_URL)

      - name: Build telemetry summary
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        shell: bash
        run: |
          IMAGE_SIZE=$(podman image inspect "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" \
            --format '{{.Size}}' 2>/dev/null || echo "0")
          IMAGE_SIZE_MB=$(( IMAGE_SIZE / 1024 / 1024 ))
          LAYER_COUNT=$(podman image inspect "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" \
            --format '{{len .RootFS.Layers}}' 2>/dev/null || echo "?")

          {
            echo "## Build Telemetry: ${{ env.IMAGE_NAME }}"
            echo ""
            echo "**Image size (uncompressed):** ${IMAGE_SIZE_MB} MB"
            echo "**Layer count:** ${LAYER_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"
