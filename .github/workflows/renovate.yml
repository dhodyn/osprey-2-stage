name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"

permissions: {}

jobs:
  renovate:
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-renovate.yml@d18642a8b4b325c2551eabd9a65c1ad12b4ebb30 # v1
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}
