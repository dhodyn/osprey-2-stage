name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"

permissions: {}

jobs:
  renovate:
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-renovate.yml@d0abf8999cf9fe16d2ef5bdc2a42a91ce8809645 # v1
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}
