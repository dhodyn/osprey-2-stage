name: Validate Brewfiles
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "custom/brew/**"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@962acc985cf741e4f7a112a3cfa6194386b63edf # master

      - name: Validate Brewfiles
        shell: bash
        run: |
          set -u

          echo "Validating Brewfiles in custom/brew/ directory..."

          fail=0

          while IFS= read -r -d '' brewfile; do
              echo "::group:: ===$(basename "$brewfile")==="
              status=0

              while IFS= read -r formula; do
                [ -z "$formula" ] && continue
                if brew info --formula "$formula" >/dev/null 2>&1; then
                  echo "✓ formula: $formula"
                else
                  echo "✗ formula not found: $formula"
                  status=1
                fi
              done < <(grep -Eo '^[[:space:]]*brew[[:space:]]+"[^"]+"' "$brewfile" | sed -E 's/^[[:space:]]*brew[[:space:]]*"//; s/"$//')

              while IFS= read -r cask; do
                [ -z "$cask" ] && continue
                if brew info --cask "$cask" >/dev/null 2>&1; then
                  echo "✓ cask: $cask"
                else
                  echo "✗ cask not found: $cask"
                  status=1
                fi
              done < <(grep -Eo '^[[:space:]]*cask[[:space:]]+"[^"]+"' "$brewfile" | sed -E 's/^[[:space:]]*cask[[:space:]]*"//; s/"$//')

              while IFS= read -r tap; do
                [ -z "$tap" ] && continue
                tap_repo="$(printf '%s' "$tap" | sed -E 's#^([^/]+)/([^/]+)$#\1/homebrew-\2#')"
                if git ls-remote --exit-code "https://github.com/${tap_repo}.git" HEAD >/dev/null 2>&1; then
                  echo "✓ tap: $tap"
                else
                  echo "✗ tap not found: $tap"
                  status=1
                fi
              done < <(grep -Eo '^[[:space:]]*tap[[:space:]]+"[^"]+"' "$brewfile" | sed -E 's/^[[:space:]]*tap[[:space:]]*"//; s/"$//')

              if [ "$status" -eq 0 ]; then
                echo "✓ $brewfile is valid"
              else
                echo "✗ $brewfile validation failed"
                fail=1
              fi
              echo "::endgroup::"
            done < <(find "custom/brew" -iname '*\.Brewfile*' -print0)

          exit "$fail"
